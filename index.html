<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>IPTV Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
  :root{
    --bg:#0e1016; --panel:#151822; --panel2:#1c2030; --line:#262b3d;
    --text:#e8eaf2; --muted:#8b92a8; --accent:#4f8cff; --accent2:#7c5cff;
    --ok:#3ecf8e; --bad:#ff5c6c; --warn:#ffb84d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .app{display:grid;grid-template-columns:380px 1fr;height:100vh}
  /* sidebar */
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side-head{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .brand .dot{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:14px}
  .brand small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
  input[type=search],input[type=text],select{
    width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;font:inherit;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap;flex:0 0 auto}
  .list{flex:1;overflow-y:auto;min-height:0}
  .list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:#2c3248;border-radius:8px}
  .ch{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #1a1e2b}
  .ch:hover{background:var(--panel2)}
  .ch.active{background:linear-gradient(90deg,rgba(79,140,255,.22),transparent);box-shadow:inset 3px 0 var(--accent)}
  .logo{width:40px;height:40px;border-radius:8px;background:#0b0d13;flex:0 0 40px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-weight:700;font-size:13px}
  .logo img{width:100%;height:100%;object-fit:contain}
  .meta{min-width:0;flex:1}
  .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .grp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12px}
  .star{background:none;border:0;color:#4a5068;font-size:18px;cursor:pointer;padding:4px;line-height:1}
  .star.on{color:var(--warn)} .star:hover{color:var(--warn)}
  .empty{padding:30px 16px;text-align:center;color:var(--muted)}
  .count{padding:7px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
  /* main */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .stage{position:relative;background:#000;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;background:#000;outline:none}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.55);text-align:center;padding:20px;pointer-events:none}
  .overlay.show{display:flex}
  .overlay button{pointer-events:auto}
  .spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:20px}
  .welcome h2{color:var(--text);font-size:22px}
  .bar{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .now{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
  .now .t{min-width:0}
  .now .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
  .now .t span{color:var(--muted);font-size:12px}
  .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctl label{color:var(--muted);font-size:12px}
  .ctl select{width:auto;padding:7px 9px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:rgba(62,207,142,.4)}
  .pill.bad{color:var(--bad);border-color:rgba(255,92,108,.4)}
  .pill.warn{color:var(--warn);border-color:rgba(255,184,77,.4)}
  .menu-btn{display:none}
  .loading-list{padding:30px;text-align:center;color:var(--muted)}
  @media(max-width:820px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
    .main{order:-1;position:sticky;top:0;z-index:5}
    .stage{flex:none;aspect-ratio:16/9}
    .side{height:calc(100vh - 56.25vw - 70px)}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><div class="dot">▶</div> IPTV Player <small id="total"></small></div>
      <input id="search" type="search" placeholder="Search channels…  ( press / )" autocomplete="off">
      <div class="row">
        <select id="group"><option value="">All categories</option></select>
        <label class="chk"><input type="checkbox" id="favOnly"> ★ Favorites</label>
      </div>
      <div class="row">
        <select id="preset" title="Playlist source">
          <option value="https://iptv-org.github.io/iptv/index.m3u">All channels (index.m3u)</option>
          <option value="https://iptv-org.github.io/iptv/countries/in.m3u">India</option>
          <option value="https://iptv-org.github.io/iptv/countries/us.m3u">United States</option>
          <option value="https://iptv-org.github.io/iptv/countries/gb.m3u">United Kingdom</option>
          <option value="https://iptv-org.github.io/iptv/languages/mal.m3u">Malayalam</option>
          <option value="https://iptv-org.github.io/iptv/languages/hin.m3u">Hindi</option>
          <option value="https://iptv-org.github.io/iptv/languages/eng.m3u">English</option>
          <option value="https://iptv-org.github.io/iptv/categories/news.m3u">News</option>
          <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">Sports</option>
          <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">Movies</option>
          <option value="https://iptv-org.github.io/iptv/categories/music.m3u">Music</option>
          <option value="https://iptv-org.github.io/iptv/categories/kids.m3u">Kids</option>
          <option value="custom">Custom URL…</option>
        </select>
      </div>
      <input id="custom" type="text" placeholder="Paste any .m3u URL and press Enter" style="display:none">
    </div>
    <div class="count" id="count">Loading…</div>
    <div class="list" id="list"><div class="loading-list">Loading playlist…</div></div>
  </aside>

  <section class="main">
    <div class="stage">
      <video id="video" controls playsinline autoplay></video>
      <div class="welcome" id="welcome">
        <h2>Pick a channel</h2>
        <div>Choose anything from the list on the left to start watching.</div>
      </div>
      <div class="overlay" id="overlay">
        <div class="spinner" id="spinner"></div>
        <div id="ovMsg">Buffering…</div>
        <div class="row" id="ovBtns" style="display:none;gap:8px;flex:none">
          <button class="btn primary" id="retryBtn">Retry</button>
          <button class="btn" id="nextBtn2">Next channel</button>
        </div>
      </div>
    </div>
    <div class="bar">
      <div class="now">
        <div class="logo" id="nowLogo">TV</div>
        <div class="t"><b id="nowName">No channel selected</b><span id="nowGroup">—</span></div>
      </div>
      <div class="ctl">
        <span class="pill" id="statusPill">idle</span>
        <label for="quality">Quality</label>
        <select id="quality" disabled><option value="-1">Auto</option></select>
        <button class="btn" id="prevBtn" title="Previous channel (←)">◀</button>
        <button class="btn" id="nextBtn" title="Next channel (→)">▶</button>
        <button class="btn" id="pipBtn" title="Picture in picture">PiP</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), listEl = $('list'), searchEl = $('search'), groupEl = $('group');
  const favOnlyEl = $('favOnly'), qualityEl = $('quality'), statusPill = $('statusPill');
  const overlay = $('overlay'), ovMsg = $('ovMsg'), spinner = $('spinner'), ovBtns = $('ovBtns');

  let channels = [];       // all parsed
  let filtered = [];       // after search/filter
  let rendered = 0;        // how many rows currently in DOM
  const CHUNK = 120;
  let current = null;      // currently playing channel
  let hls = null;
  let retries = 0;
  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem('iptv_favs') || '[]')); } catch(e){}
  const saveFavs = () => { try { localStorage.setItem('iptv_favs', JSON.stringify([...favs])); } catch(e){} };

  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const keyOf = c => c.url;

  /* ---------- Playlist loading ---------- */
  async function loadPlaylist(url) {
    listEl.innerHTML = '<div class="loading-list">Loading playlist…</div>';
    $('count').textContent = 'Loading…';
    try {
      const res = await fetch(url, {cache: 'default'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      channels = parseM3U(text);
      buildGroups();
      applyFilter();
      $('total').textContent = channels.length.toLocaleString() + ' channels';
    } catch (err) {
      listEl.innerHTML = '<div class="empty">Could not load the playlist.<br><small>' + esc(String(err.message || err)) +
        '</small><br><br><button class="btn primary" id="reloadList">Try again</button></div>';
      $('count').textContent = 'Error';
      const b = $('reloadList'); if (b) b.onclick = () => loadPlaylist(currentPlaylistUrl());
    }
  }

  function parseM3U(text) {
    const out = [], seen = new Set();
    const lines = text.split(/\r?\n/);
    let info = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      if (line.startsWith('#EXTINF')) {
        const attr = k => { const m = line.match(new RegExp(k + '="([^"]*)"', 'i')); return m ? m[1] : ''; };
        const comma = line.lastIndexOf(',');
        info = {
          name: (comma >= 0 ? line.slice(comma + 1) : '').trim() || attr('tvg-name') || 'Unnamed',
          logo: attr('tvg-logo'),
          group: (attr('group-title') || 'Uncategorized').split(';')[0].trim() || 'Uncategorized',
          id: attr('tvg-id')
        };
      } else if (line[0] !== '#' && info) {
        if (/^https?:\/\//i.test(line) && !seen.has(line)) {
          seen.add(line);
          out.push({ ...info, url: line, lower: (info.name + ' ' + info.group).toLowerCase() });
        }
        info = null;
      }
    }
    return out;
  }

  function buildGroups() {
    const counts = new Map();
    channels.forEach(c => counts.set(c.group, (counts.get(c.group) || 0) + 1));
    const sorted = [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    const prev = groupEl.value;
    groupEl.innerHTML = '<option value="">All categories (' + channels.length + ')</option>' +
      sorted.map(([g, n]) => '<option value="' + esc(g) + '">' + esc(g) + ' (' + n + ')</option>').join('');
    if (counts.has(prev)) groupEl.value = prev;
  }

  /* ---------- List rendering (chunked for speed) ---------- */
  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    const g = groupEl.value;
    const favOnly = favOnlyEl.checked;
    const terms = q ? q.split(/\s+/) : [];
    filtered = channels.filter(c =>
      (!g || c.group === g) &&
      (!favOnly || favs.has(keyOf(c))) &&
      terms.every(t => c.lower.includes(t)));
    $('count').textContent = filtered.length.toLocaleString() + ' of ' + channels.length.toLocaleString() + ' channels';
    listEl.innerHTML = '';
    listEl.scrollTop = 0;
    rendered = 0;
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty">No channels match.</div>';
      return;
    }
    renderMore();
  }

  function rowHTML(c, idx) {
    const initials = esc(c.name.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'TV');
    const logo = c.logo
      ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(c.logo) + '" onerror="this.remove()" alt="">'
      : '';
    const active = current && current.url === c.url ? ' active' : '';
    const fav = favs.has(keyOf(c));
    return '<div class="ch' + active + '" data-i="' + idx + '">' +
      '<div class="logo">' + logo + (c.logo ? '' : initials) + '</div>' +
      '<div class="meta"><div class="name">' + esc(c.name) + '</div><div class="grp">' + esc(c.group) + '</div></div>' +
      '<button class="star' + (fav ? ' on' : '') + '" data-star="' + idx + '" title="Favorite">' + (fav ? '★' : '☆') + '</button></div>';
  }

  function renderMore() {
    if (rendered >= filtered.length) return;
    const end = Math.min(rendered + CHUNK, filtered.length);
    let html = '';
    for (let i = rendered; i < end; i++) html += rowHTML(filtered[i], i);
    listEl.insertAdjacentHTML('beforeend', html);
    rendered = end;
  }

  listEl.addEventListener('scroll', () => {
    if (listEl.scrollTop + listEl.clientHeight > listEl.scrollHeight - 400) renderMore();
  });

  listEl.addEventListener('click', e => {
    const star = e.target.closest('[data-star]');
    if (star) {
      e.stopPropagation();
      const c = filtered[+star.dataset.star];
      const k = keyOf(c);
      if (favs.has(k)) favs.delete(k); else favs.add(k);
      saveFavs();
      star.classList.toggle('on', favs.has(k));
      star.textContent = favs.has(k) ? '★' : '☆';
      if (favOnlyEl.checked) applyFilter();
      return;
    }
    const row = e.target.closest('.ch');
    if (row) play(filtered[+row.dataset.i]);
  });

  let t;
  searchEl.addEventListener('input', () => { clearTimeout(t); t = setTimeout(applyFilter, 150); });
  groupEl.addEventListener('change', applyFilter);
  favOnlyEl.addEventListener('change', applyFilter);

  /* ---------- Playlist source picker ---------- */
  const presetEl = $('preset'), customEl = $('custom');
  const currentPlaylistUrl = () => presetEl.value === 'custom' ? customEl.value.trim() : presetEl.value;
  presetEl.addEventListener('change', () => {
    if (presetEl.value === 'custom') { customEl.style.display = 'block'; customEl.focus(); }
    else { customEl.style.display = 'none'; loadPlaylist(presetEl.value); }
  });
  customEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && customEl.value.trim()) loadPlaylist(customEl.value.trim());
  });

  /* ---------- Playback ---------- */
  function setStatus(text, cls) {
    statusPill.textContent = text;
    statusPill.className = 'pill' + (cls ? ' ' + cls : '');
  }
  function showOverlay(msg, opts = {}) {
    ovMsg.textContent = msg;
    spinner.style.display = opts.spinner === false ? 'none' : 'block';
    ovBtns.style.display = opts.buttons ? 'flex' : 'none';
    overlay.classList.add('show');
  }
  const hideOverlay = () => overlay.classList.remove('show');

  function destroyPlayer() {
    if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
    video.removeAttribute('src');
    video.load();
    qualityEl.innerHTML = '<option value="-1">Auto</option>';
    qualityEl.disabled = true;
  }

  function play(ch) {
    if (!ch) return;
    current = ch;
    retries = 0;
    $('welcome').style.display = 'none';
    $('nowName').textContent = ch.name;
    $('nowGroup').textContent = ch.group;
    const nl = $('nowLogo');
    nl.innerHTML = ch.logo ? '<img referrerpolicy="no-referrer" src="' + esc(ch.logo) + '" onerror="this.remove()" alt="">' : esc(ch.name.slice(0,2).toUpperCase());
    document.title = ch.name + ' · IPTV Player';
    document.querySelectorAll('.ch.active').forEach(el => el.classList.remove('active'));
    const idx = filtered.indexOf(ch);
    const row = listEl.querySelector('.ch[data-i="' + idx + '"]');
    if (row) row.classList.add('active');
    start(ch);
  }

  function start(ch) {
    destroyPlayer();
    setStatus('connecting…', 'warn');
    showOverlay('Connecting to ' + ch.name + '…');

    let url = ch.url;
    // Browsers block http streams on https pages; try the https version first.
    if (location.protocol === 'https:' && url.startsWith('http://')) url = 'https://' + url.slice(7);

    const isHls = /\.m3u8?(\?|$)/i.test(url) || !/\.(mp4|webm|ogg|mp3|aac)(\?|$)/i.test(url);

    if (isHls && window.Hls && Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,          // stability over latency = fewer stalls
        startLevel: -1,
        capLevelToPlayerSize: true,     // don't download more pixels than needed
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        backBufferLength: 30,
        liveSyncDurationCount: 4,       // stay a few segments behind live edge for a cushion
        liveMaxLatencyDurationCount: 12,
        abrEwmaDefaultEstimate: 1_500_000,
        abrBandWidthFactor: 0.85,
        abrBandWidthUpFactor: 0.6,      // be cautious going up in quality
        manifestLoadingMaxRetry: 3,
        levelLoadingMaxRetry: 4,
        fragLoadingMaxRetry: 5,
        fragLoadingRetryDelay: 600,
        manifestLoadingTimeOut: 12000,
        nudgeMaxRetry: 8
      });
      hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
        buildQualityMenu(data.levels);
        video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); });
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => {
        if (qualityEl.value === '-1') {
          const lv = hls.levels[d.level];
          if (lv) setStatus('Auto · ' + (lv.height ? lv.height + 'p' : Math.round(lv.bitrate/1000) + 'k'), 'ok');
        }
      });
      hls.on(Hls.Events.FRAG_BUFFERED, () => { retries = 0; });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retries < 3) {
          retries++; showOverlay('Network hiccup, retrying (' + retries + '/3)…');
          setTimeout(() => hls && hls.startLoad(), 800 * retries);
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && retries < 3) {
          retries++; showOverlay('Recovering playback…');
          hls.recoverMediaError();
        } else {
          fail('This stream is offline or blocked (' + (data.details || data.type) + ').');
        }
      });
      hls.loadSource(url);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl') && isHls) {
      video.src = url;           // Safari / iOS native HLS
      video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); });
    } else {
      video.src = url;           // direct mp4/audio
      video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); });
    }
  }

  function fail(msg) {
    setStatus('offline', 'bad');
    showOverlay(msg, { spinner: false, buttons: true });
  }

  function buildQualityMenu(levels) {
    const opts = ['<option value="-1">Auto</option>'];
    levels.map((l, i) => ({l, i}))
      .sort((a, b) => (b.l.height || 0) - (a.l.height || 0) || b.l.bitrate - a.l.bitrate)
      .forEach(({l, i}) => {
        const label = l.height ? l.height + 'p' : Math.round(l.bitrate / 1000) + ' kbps';
        opts.push('<option value="' + i + '">' + label + '</option>');
      });
    qualityEl.innerHTML = opts.join('');
    qualityEl.disabled = levels.length < 2;
    qualityEl.value = '-1';
  }
  qualityEl.addEventListener('change', () => {
    if (!hls) return;
    const v = +qualityEl.value;
    hls.currentLevel = v;           // -1 = auto
    if (v >= 0) { const lv = hls.levels[v]; setStatus('Fixed · ' + (lv.height ? lv.height + 'p' : Math.round(lv.bitrate/1000)+'k'), 'ok'); }
  });

  video.addEventListener('waiting', () => { if (current) showOverlay('Buffering…'); });
  video.addEventListener('stalled', () => { if (current && !video.paused) showOverlay('Buffering…'); });
  video.addEventListener('playing', () => { hideOverlay(); if (qualityEl.value !== '-1') {} else if (!hls) setStatus('playing', 'ok'); });
  video.addEventListener('canplay', hideOverlay);
  video.addEventListener('error', () => { if (!hls && current) fail('This stream can\'t be played in the browser.'); });

  /* ---------- Controls ---------- */
  function step(d) {
    if (!filtered.length) return;
    let i = current ? filtered.indexOf(current) : -1;
    i = (i + d + filtered.length) % filtered.length;
    while (i >= rendered) renderMore();
    play(filtered[i]);
    const row = listEl.querySelector('.ch[data-i="' + i + '"]');
    if (row) row.scrollIntoView({ block: 'nearest' });
  }
  $('nextBtn').onclick = () => step(1);
  $('prevBtn').onclick = () => step(-1);
  $('nextBtn2').onclick = () => step(1);
  $('retryBtn').onclick = () => current && start(current);
  $('pipBtn').onclick = async () => {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await video.requestPictureInPicture();
    } catch (e) {}
  };
  document.addEventListener('keydown', e => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); searchEl.focus(); }
    else if (!typing && e.key === 'ArrowRight') step(1);
    else if (!typing && e.key === 'ArrowLeft') step(-1);
    else if (!typing && e.key.toLowerCase() === 'f') { document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen?.(); }
    else if (!typing && e.key.toLowerCase() === 'm') video.muted = !video.muted;
  });

  loadPlaylist(presetEl.value);
})();
</script>
</body>
</html>
